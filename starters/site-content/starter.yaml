category: blog / small publication
pattern: object-first
description: >
  Home page of a small publication or a personal blog. P1 = find something
  worth reading now; the second job is to keep the reader (subscribe).
  Sections: masthead with a strapline, one lead piece, latest list with
  byline/date/reading time, topics, subscribe form. Carries an empty state
  for a publication with nothing out yet.
