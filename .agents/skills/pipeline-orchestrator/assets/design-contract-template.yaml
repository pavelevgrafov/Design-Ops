# design-contract.yaml — Single Source of Truth, schema v7.0
# Location: artifacts/design-contract.yaml
# Rules: contract beats markdown; changelog beats field values; earlier stage
# wins where the contract is silent. Decision log: artifacts/decision-log.md.
# v7.0: job_hypothesis + assumptions (discovery-lite), sources_pin (wiki-sync),
# design_review (K2B audit). v6.0: artifact profiles (site|app), starters,
# integrations (pack bus), deploy, knowledge vault, cost, gate modes.
# Sections new in 6.0/7.0 are nullable and default-empty; contracts 5.1/6.0
# migrate via scripts/contract-migrate.py.

meta:
  schema_version: "7.0"
  created_at: ""            # ISO-8601, from `date` at contract init
  updated_at: ""
  autonomous_granted_by: "" # [A.26] the owner's explicit word for THIS run,
                            # verbatim + when. Being unresponsive is NOT a
                            # grant; without this, autonomous mode is a defect.
  # --- depth and schedule (v7.2, У-5/У-6) ------------------------------------
  target_lod: 200           # 100|200|300|400 — agreed depth, not a guess.
                            # A result "not detailed enough" is a target that
                            # was never set, not laziness.
  lod_overrides: []         # [{scope: "section:hero", target_lod: 300}]
  run_plan: []              # [{stage, checkpoint, eta_min, human_needed,
                            #   attention_min}] — written at classification so
                            # the owner knows up front where they are needed
                            # and for how long in total
  paused: false             # control queue: pause|resume
  pause_after: ""           # checkpoint id the conveyor stops after
  mode: ""                  # quick | standard | full
  mode_override_reason: ""  # required whenever mode != auto-selection
  interaction_mode: ""      # interactive | autonomous
  artifact_type: ""         # website | web_app | dashboard | landing_page
  artifact_profile: ""      # site | app — drives conveyor defaults (v6)

product:
  name: ""
  category: ""
  user_outcome: ""
  business_outcome: ""
  risk_level: ""            # low | medium | high
  audience: []
  clarification: ""         # questions_asked | assumptions_logged | mixed
  visual_boldness: ""       # conventional | familiar_distinctive | challenger | experimental
  job_hypothesis:           # v7.0 AJTBD-lite (k0-discovery-lite.md)
    statement: ""           # "When [situation], I want to [action], so I can [outcome]"
    confidence: ""          # low | medium | high (high = owner confirmed)
    source: ""              # user_answer | inferred_from_request | category_default

experience:
  primary_job: ""
  key_screens: []           # [{id, name, purpose}] — site scaling checklist
  required_states: []
  scenarios: []
  localization_risk: false
  trigger_reason: ""
  assumptions: []           # v7.0 RAT-lite: max 3 — [{claim, lethality: high|medium|low,
                            #  evidence, kill_criteria}]; evidence = vault cross-reference

content_model:
  pattern: ""               # answer-first | task-first | object-first | event-first | comparison-first
  pattern_reason: ""

# --- app profile (v6; empty for site) --------------------------------------
domain_model: {}            # entities, fields, relations, enum statuses — BEFORE screens
roles_permissions: {}       # RBAC matrix: role x action x object
user_flows: []              # looped flows; screens hang off flows
screen_modules: []          # key_screens grouped by module with priorities
state_matrix: []            # screen x state x role x data-volume
api_contract: {}            # {spec: path(OpenAPI/JSON Schema), mock: dir}

# --- starters (v6) -----------------------------------------------------------
starters:
  route: ""                 # starter_first | from_scratch
  chosen: ""                # starter id
  skin_diverged: false

visual:
  category_anchors: []
  base_skin: ""             # base-site | base-app — applied at K2A (v6)
  calibration:
    references: []
    anti_references: []
    style_card_result: ""
    status: ""              # done | skipped_autonomous | deferred (K2B deferred)
  directions: []            # per direction: axes, seeds, boldness point, blind_test,
                            #   dials {variance, motion, density} (v7.0 Three Dials)
  design_review: ""         # v7.0 K2B audit: pass | fail(<lines>) | pending
  gate2_randomization: {}
  gate2_result: ""          # chosen(A) | merged(...) | regenerated | provisional_ai(X)
  merge:
    axes_resolution: {}
    coherence_check: ""
    confirm_render: ""
  post_scale:
    failure_budget: 1
    used: 0
    hypothesis_log: []
  final_direction: {}
  distinctive_assets: []

gates:
  mode: ""                  # separate | batched | overtaking (v7.2, [A.25])
  gate1: ""                 # pending | provisional | passed | changes_requested | autonomous_passed
  gate2: ""                 # pending | provisional | passed | provisional_ai | regenerated | deferred
  gate2_deferred: false     # K2B not requested yet (v6)
  gate3: ""                 # pending | passed — exists only with deploy pack
  delegated: []             # gates delegated to machine (provisional_ai)
  # --- gate-overtaking (v7.2, [A.25]; mechanics: references/gate-overtaking.md)
  provisional_since: ""     # ISO-8601 — when the machine went ahead of the answer
  provisional_scope: []     # [K2A, K3, K2B-slice] — what was done on credit
  provisional_plateau: ""   # the checkpoint the run stops at, never mid-stage

# --- process control (v7.2, У-2/У-3) -----------------------------------------
# Checkpoints and control commands are EVENTS with a chronology, so they live
# in append-only logs next to the contract rather than inside it: rewriting the
# contract on every publish would destroy its comments and its diffability.
# Read them through contract-read.py (`checkpoints`, `control_queue`) — the
# contract stays the single entry point [A.10].
process:
  checkpoints_log: "artifacts/checkpoints.jsonl"   # dops checkpoint
  control_queue_log: "artifacts/control-queue.jsonl"  # dops control
  announcements_log: "artifacts/announcements.jsonl"  # dops announce [A.26]

scope:
  exclusions: []            # [{what, reason, at}] — control `skip_scope`.
                            # The core floor can never be excluded [E.4].

# --- pack bus (v6) -----------------------------------------------------------
integrations: []            # {pack, version, class: core|peripheral, status,
                            #  env_present, acceptance: pass|fail|unavailable, cost_tier}

deploy:
  previews: []              # {url, at, floor_passed}
  prod:
    confirmed_by: ""
    at: ""
    rollback_tested: false  # dry-run rollback passed (Gate 3 acceptance)

knowledge:
  vault_path: "knowledge/"
  index_kb: 0
  sources_pin:              # v7.0 wiki-sync: frozen knowledge provenance
    ux_wiki: {tag: "", sha256: ""}
    design_ops: {tag: ""}

cost:
  estimate: ""              # shown before start: mode, ~time, ~tokens
  actual: ""                # filled after the run

assets:
  slots: []
  planned: []
  all_local: false

acceptance:
  target_viewports: [390, 768, 1440]
  scenarios: []
  functional_paths:
    primary: ""
    alternative: ""
    error_recovery: ""
    keyboard_path: ""
  functional_paths_matrix: []   # app: [{flow, role, path, permission_denied}] (v6)
  automated_checks: {}

status:
  lod: 0                        # depth actually reached; a gap against
                                # meta.target_lod with no owner command is a
                                # defect line in the delivery report
  deliverable_blocked: false    # true while ANY gate is `provisional` [A.25];
                                # gate-require.py refuses verdict/deliver/deploy
  skeleton_approved: false
  base_skin_applied: false      # K2A done (v6)
  direction_confirmed: false
  scaled: false
  qa_cycles_completed: 0
  verdict: ""               # ready | ready_with_caveats | not_ready

changelog: []               # [{at, author: user|agent, field, from, to, reason}]
