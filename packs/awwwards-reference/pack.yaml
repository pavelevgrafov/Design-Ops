id: awwwards-reference
type: local
conveyor: [K2]
class: peripheral
provides: [curated_reference_directions]
requires_env: []
contract_fields: [visual.calibration, integrations]
acceptance_test: 'python3 "{pack_dir}/scripts/search-references.py" --self-test'
