id: landing-event
profile: site
category: event / festival promo
pattern: task-first
description: >
  Single-page promo for a dated event (festival, conference, fair, open day).
  P1 = buy a ticket; the second job is "what is on, when, and can I get
  there". Sections: dateline hero, day-by-day programme, ticket tiers with a
  sold-out state, getting-there + FAQ. Copy slots only, no stock imagery
  required.
